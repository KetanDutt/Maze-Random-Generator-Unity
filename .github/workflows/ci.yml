name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  reference-tests:
    name: Reference implementation (no Unity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Algorithm invariants, openings, braiding, mesh, paths
        run: python3 Tools/Reference/verify_maze_reference.py
      - name: Performance characterisation
        run: python3 Tools/Reference/benchmark_reference.py
      - name: Documentation images build (smoke test)
        run: |
          python3 -m pip install --quiet pillow
          python3 Tools/Reference/generate_docs_images.py

  csharp-checks:
    name: C# static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the parser
        run: npm install --no-save web-tree-sitter@0.22.6 tree-sitter-wasms
      - name: Parse every script
        run: node Tools/Reference/lint_csharp.mjs Assets/Code
      - name: Check member references
        run: node Tools/Reference/check_references.mjs Assets/Code

  # Run the Unity EditMode test suite. Requires a Unity license in the repository secrets
  # (see https://game.ci/docs/github/activation). Enable it by removing the `if: false` line.
  unity-tests:
    name: Unity EditMode tests
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.21f1
          testMode: editmode
          artifactsPath: test-results
